name: Hello CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Say hello
        run: |
        echo "Hello from GitHub Actions! Commit: $GITHUB_SHA"
        
