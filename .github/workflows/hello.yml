name: Hello CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        type: choice
        options: [staging, production]
        default: staging
      version:
        description: "Image tag to deploy"
        type: string
        required: true
      dry_run:
        type: boolean
        default: true
env:
  VARIABLE: "TEST"

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Say hello
        run: |
          echo "Hello from GitHub Actions! Commit: $GITHUB_SHA"
          echo "${{env.VARIABLE}}"
          echo "${{vars.TEST_SECRET}}"
        
      - name: Look around
        run: |
          echo "Runner OS: $RUNNER_OS"
          pwd
          ls -la
          uname -a